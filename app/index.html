<style>
  :root {
    --bg: #fafafa; --card: #fff; --text: #111827; --muted: #4b5563;
    --border: #e5e7eb; --accent: #1d63dc; --err-bg: #fef2f2; --err-text: #991b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  label { font-weight: 600; display: block; margin-bottom: 8px; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  textarea, input {
    width: 100%; padding: 10px; font: inherit;
    border: 1px solid var(--border); border-radius: 8px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .examples input { margin-bottom: 8px; }
  button { margin-top: 4px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
           background: var(--accent); color: #fff; border: none; border-radius: 8px; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .draft { background: var(--bg); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  .error { background: var(--err-bg); color: var(--err-text); border-radius: 8px; padding: 12px; }
  .note { font-size: 13px; color: var(--muted); margin-bottom: 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ghostwriter</h1>
  <p class="sub">Build 2: paste Carly's text and a few of your own, and AI drafts a reply in your style. Nothing is sent.</p>
  <p class="note">Heads up: this page uses PostHog analytics, including session recordings, so I can see how visitors use it.</p>

  <div class="card">
    <label for="incoming">Carly's text</label>
    <textarea id="incoming" placeholder="e.g. are we still on for trivia this week??"></textarea>
  </div>

  <div class="card examples">
    <label>Your texts (3–5 style examples)</label>
    <p class="hint">Paste texts you've actually sent, so the draft sounds like you.</p>
    <input class="ex" placeholder="Example 1">
    <input class="ex" placeholder="Example 2">
    <input class="ex" placeholder="Example 3">
    <input class="ex" placeholder="Example 4 (optional)">
    <input class="ex" placeholder="Example 5 (optional)">
    <button id="go">Draft reply</button>
  </div>

  <div class="card" id="result" hidden>
    <label>Draft reply</label>
    <div class="draft" id="draft"></div>
    <p class="note" id="meta"></p>
  </div>
  <div class="error" id="error" hidden></div>
</div>

<script>
const $ = id => document.getElementById(id);

async function draft() {
  const incoming = $("incoming").value.trim();
  const examples = [...document.querySelectorAll(".ex")].map(i => i.value.trim()).filter(Boolean);
  $("error").hidden = true;
  $("result").hidden = true;
  $("go").disabled = true;
  $("go").textContent = "Drafting…";
  try {
    const res = await fetch("/api/draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ incoming, examples }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    $("draft").textContent = data.draft;
    const u = data.usage;
    $("meta").textContent = `Model: ${data.model}` + (u ? ` · ${u.prompt_tokens} tokens in, ${u.completion_tokens} out` : "");
    $("result").hidden = false;
  } catch (e) {
    $("error").textContent = e.message === "Failed to fetch"
      ? "Can't reach the local backend. Is node app/server.js running?"
      : e.message;
    $("error").hidden = false;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Draft reply";
  }
}

$("go").addEventListener("click", draft);
</script>
</body>
</html>
